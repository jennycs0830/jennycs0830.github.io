<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">ASR-mediated grading study overview</title>
<desc id="desc">A student's spoken reading-comprehension answer is transcribed by ASR, then scored by an LLM judge against a rubric and compared with a human score. Higher word error rate is associated with lower judge-human agreement. The study explores adapting the ASR system and the LLM judge.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8b928d"/></marker>
  <linearGradient id="wash" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fbfe"/><stop offset="1" stop-color="#fff"/></linearGradient>
</defs>
<rect width="1280" height="760" rx="22" fill="url(#wash)"/>
<rect x="1" y="1" width="1278" height="758" rx="21" fill="none" stroke="#d9e8f4" stroke-width="2"/>
<text x="62" y="66" fill="#bd4828" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">READING COMPREHENSION · ASR-MEDIATED GRADING</text>
<text x="62" y="111" fill="#13294b" font-family="Georgia,serif" font-size="31">When speech becomes text, errors can change the score.</text>
