<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">ASR-mediated children's question-answer grading pipeline</title>
<desc id="desc">A student's spoken response is transcribed by automatic speech recognition, then scored by an LLM judge. The LLM-judge score is compared with human annotations.</desc>
