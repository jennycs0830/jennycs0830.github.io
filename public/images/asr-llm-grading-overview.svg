<text x="52" y="57" fill="#bd4828" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2">ASR-MEDIATED CHILDREN’S QA GRADING</text>
<text x="52" y="99" fill="#13294b" font-family="Georgia,serif" font-size="29">From a spoken response to an LLM-judge score</text>
<rect x="52" y="142" width="300" height="156" rx="16" fill="#eaf3fa" stroke="#c9dcee" stroke-width="2"/>
