<rect x="445" y="142" width="300" height="156" rx="16" fill="#fff1e9" stroke="#f0c7b3" stroke-width="2"/>
<circle cx="484" cy="183" r="21" fill="#f9ded1"/><path d="M471 184q7-11 14 0t14 0M471 193q7-11 14 0t14 0" fill="none" stroke="#bd4828" stroke-width="2.5" stroke-linecap="round"/>
<text x="472" y="236" fill="#13294b" font-family="Arial,sans-serif" font-size="22" font-weight="700">ASR transcription</text><text x="472" y="268" fill="#52677c" font-family="Arial,sans-serif" font-size="17">recognized text</text><path d="M473 287h56M473 296h79" stroke="#d5a48f" stroke-width="4" stroke-linecap="round"/>
