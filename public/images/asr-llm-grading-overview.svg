<text x="865" y="236" fill="#13294b" font-family="Arial,sans-serif" font-size="22" font-weight="700">LLM judge</text><text x="865" y="268" fill="#52677c" font-family="Arial,sans-serif" font-size="17">rubric-based score</text>
