<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 660" role="img" aria-labelledby="title desc">
<title id="title">Extending TUX to downstream personalized decisions</title>
<desc id="desc">A proposed study pairs CalConflictBench user profiles with profile-conditioned TUX agents. Both are evaluated on the Spectrum task to calculate pair-level TUX. The agent also resolves the user's calendar conflicts; its decisions are compared with the user's modeled decisions. The study tests whether TUX predicts downstream decision agreement, with profile similarity as a baseline.</desc>
<defs>
  <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11Z" fill="#718096"/></marker>
  <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11Z" fill="#3977b8"/></marker>
  <marker id="arrowOrange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11Z" fill="#cf6732"/></marker>
</defs>
<rect width="1480" height="660" fill="#fff"/>
<text x="42" y="54" fill="#13294b" font-family="Arial,sans-serif" font-size="30" font-weight="700">From tacit understanding to downstream collaboration</text>
<text x="43" y="88" fill="#657487" font-family="Arial,sans-serif" font-size="18">Extending TUX from measuring Spectrum alignment to testing personalized calendar decisions</text>

<!-- paired profile inputs -->
<rect x="35" y="126" width="280" height="470" rx="18" fill="#f8fbfe" stroke="#b8d2e8" stroke-width="2"/>
<text x="58" y="160" fill="#245e91" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">PAIRED INPUTS</text>
<rect x="58" y="185" width="234" height="137" rx="13" fill="#eaf3fa" stroke="#c9dcee" stroke-width="2"/>
<circle cx="86" cy="216" r="15" fill="#d7e9f7"/>
<path d="M78 226v-4a8 8 0 0 1 16 0v4M81 211a5 5 0 1 0 10 0 5 5 0 0 0-10 0" fill="none" stroke="#245e91" stroke-width="2" stroke-linecap="round"/>
<text x="110" y="214" fill="#13294b" font-family="Arial,sans-serif" font-size="16" font-weight="700">CalConflictBench</text>
<text x="78" y="253" fill="#13294b" font-family="Arial,sans-serif" font-size="16" font-weight="700">user profile</text>
<text x="78" y="280" fill="#52677c" font-family="Arial,sans-serif" font-size="14">Priority principles and</text>
<text x="78" y="301" fill="#52677c" font-family="Arial,sans-serif" font-size="14">modeled calendar choices</text>

<rect x="58" y="353" width="234" height="137" rx="13" fill="#f2edfb" stroke="#d4c5ef" stroke-width="2"/>
<circle cx="86" cy="384" r="15" fill="#e4daf6"/>
<rect x="78" y="378" width="16" height="12" rx="3" fill="none" stroke="#7049be" stroke-width="2"/>
<circle cx="86" cy="374" r="4" fill="none" stroke="#7049be" stroke-width="2"/>
<path d="M86 370v-4m-11 18h-4m30 0h-4" stroke="#7049be" stroke-width="2" stroke-linecap="round"/>
<text x="110" y="382" fill="#13294b" font-family="Arial,sans-serif" font-size="16" font-weight="700">Profile-conditioned</text>
<text x="78" y="421" fill="#13294b" font-family="Arial,sans-serif" font-size="16" font-weight="700">TUX agent</text>
<text x="78" y="450" fill="#52677c" font-family="Arial,sans-serif" font-size="14">One agent paired with</text>
<text x="78" y="471" fill="#52677c" font-family="Arial,sans-serif" font-size="14">one user profile</text>
<rect x="58" y="522" width="234" height="49" rx="24" fill="#fff" stroke="#d9e3ec" stroke-width="1.5"/>
<text x="175" y="552" text-anchor="middle" fill="#52677c" font-family="Arial,sans-serif" font-size="14" font-weight="600">Same pair enters both tasks</text>

<!-- profile pair branches into the two tasks -->
<path d="M315 359H335V263H363M335 359V473H363" fill="none" stroke="#8796a7" stroke-width="2.5" marker-end="url(#arrow)"/>

<!-- two evaluation tracks -->
<rect x="360" y="126" width="665" height="222" rx="18" fill="#f8fbfe" stroke="#b8d2e8" stroke-width="2"/>
<text x="386" y="160" fill="#245e91" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">01 · TUX FOUNDATION</text>
<rect x="386" y="184" width="255" height="133" rx="13" fill="#fff" stroke="#c9dcee" stroke-width="2"/>
<text x="407" y="217" fill="#13294b" font-family="Arial,sans-serif" font-size="18" font-weight="700">Spectrum task</text>
<text x="407" y="247" fill="#52677c" font-family="Arial,sans-serif" font-size="14">User and agent answer the</text>
<text x="407" y="269" fill="#52677c" font-family="Arial,sans-serif" font-size="14">same ambiguous items</text>
<text x="407" y="297" fill="#74859a" font-family="Arial,sans-serif" font-size="13">Independently · no feedback</text>
<path d="M648 251H677" stroke="#3977b8" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
<rect x="685" y="184" width="310" height="133" rx="13" fill="#eaf3fa" stroke="#9fc2e1" stroke-width="2"/>
<text x="708" y="219" fill="#13294b" font-family="Arial,sans-serif" font-size="18" font-weight="700">Pair-level TUX score</text>
<text x="708" y="250" fill="#52677c" font-family="Arial,sans-serif" font-size="14">Similarity between the user’s</text>
<text x="708" y="272" fill="#52677c" font-family="Arial,sans-serif" font-size="14">and agent’s Spectrum placements</text>
<rect x="708" y="286" width="134" height="20" rx="10" fill="#d7e9f7"/>
<text x="775" y="301" text-anchor="middle" fill="#245e91" font-family="Arial,sans-serif" font-size="12" font-weight="700">EXISTING MEASURE</text>

<rect x="360" y="369" width="665" height="227" rx="18" fill="#fffaf6" stroke="#efc5ac" stroke-width="2"/>
<text x="386" y="403" fill="#bd5728" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">02 · OUR DOWNSTREAM EXTENSION</text>
<rect x="386" y="428" width="178" height="132" rx="13" fill="#fff" stroke="#f0c7b3" stroke-width="2"/>
<text x="405" y="461" fill="#13294b" font-family="Arial,sans-serif" font-size="16" font-weight="700">Calendar-conflict</text>
<text x="405" y="483" fill="#13294b" font-family="Arial,sans-serif" font-size="16" font-weight="700">cases</text>
<text x="405" y="517" fill="#52677c" font-family="Arial,sans-serif" font-size="13">Personalized priorities</text>
<text x="405" y="538" fill="#52677c" font-family="Arial,sans-serif" font-size="13">from user profile</text>
<path d="M568 494H588" stroke="#cf6732" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
<rect x="596" y="428" width="176" height="132" rx="13" fill="#fff1e9" stroke="#f0c7b3" stroke-width="2"/>
<text x="616" y="465" fill="#13294b" font-family="Arial,sans-serif" font-size="16" font-weight="700">TUX agent</text>
<text x="616" y="494" fill="#52677c" font-family="Arial,sans-serif" font-size="13">Resolves the user’s</text>
<text x="616" y="515" fill="#52677c" font-family="Arial,sans-serif" font-size="13">calendar conflicts</text>
<path d="M776 494H796" stroke="#cf6732" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
<rect x="804" y="428" width="191" height="132" rx="13" fill="#fff1e9" stroke="#e7a77f" stroke-width="2"/>
<text x="824" y="461" fill="#13294b" font-family="Arial,sans-serif" font-size="16" font-weight="700">Decision agreement</text>
<text x="824" y="494" fill="#52677c" font-family="Arial,sans-serif" font-size="13">Agent choices vs. user’s</text>
<text x="824" y="515" fill="#52677c" font-family="Arial,sans-serif" font-size="13">modeled decisions</text>
<rect x="824" y="530" width="117" height="19" rx="9" fill="#fde3d4"/>
<text x="882" y="544" text-anchor="middle" fill="#bd5728" font-family="Arial,sans-serif" font-size="11" font-weight="700">DOWNSTREAM</text>

<!-- predictive validity -->
<rect x="1050" y="126" width="395" height="470" rx="18" fill="#fff" stroke="#efb18e" stroke-width="2" stroke-dasharray="8 7"/>
<text x="1076" y="160" fill="#bd5728" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">03 · PROPOSED TEST</text>
<text x="1076" y="205" fill="#13294b" font-family="Georgia,serif" font-size="25">Does TUX predict</text>
<text x="1076" y="237" fill="#13294b" font-family="Georgia,serif" font-size="25">downstream agreement?</text>
<rect x="1080" y="271" width="330" height="73" rx="13" fill="#eaf3fa" stroke="#c9dcee" stroke-width="2"/>
<text x="1102" y="301" fill="#245e91" font-family="Arial,sans-serif" font-size="16" font-weight="700">Pair-level TUX</text>
<text x="1102" y="325" fill="#52677c" font-family="Arial,sans-serif" font-size="13">Spectrum placement similarity</text>
<path d="M1245 350V384" stroke="#718096" stroke-width="2.5" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
<rect x="1180" y="354" width="130" height="25" rx="12" fill="#fff" stroke="#e5eaf0"/>
<text x="1245" y="371" text-anchor="middle" fill="#657487" font-family="Arial,sans-serif" font-size="12" font-weight="600">test association</text>
<rect x="1080" y="391" width="330" height="73" rx="13" fill="#fff1e9" stroke="#f0c7b3" stroke-width="2"/>
<text x="1102" y="421" fill="#bd5728" font-family="Arial,sans-serif" font-size="16" font-weight="700">Calendar decision agreement</text>
<text x="1102" y="445" fill="#52677c" font-family="Arial,sans-serif" font-size="13">Personalized downstream alignment</text>
<rect x="1080" y="492" width="330" height="67" rx="12" fill="#fafafa" stroke="#e4e7eb" stroke-width="1.5"/>
<text x="1102" y="519" fill="#52677c" font-family="Arial,sans-serif" font-size="13" font-weight="600">Comparison baseline</text>
<text x="1102" y="541" fill="#657487" font-family="Arial,sans-serif" font-size="13">Profile similarity</text>
<text x="43" y="631" fill="#8a929b" font-family="Arial,sans-serif" font-size="13">Conceptual overview of the proposed study · No downstream results are implied</text>
</svg>